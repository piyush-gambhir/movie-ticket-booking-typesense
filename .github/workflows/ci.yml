name: CI

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Schemas and Python Scripts
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install script requirements
        run: |
          pip install -r scripts/requirements.txt

      - name: Python compile check
        run: |
          python -m py_compile scripts/*.py

      - name: Validate JSON schemas
        run: |
          python -c "import json, glob; [json.load(open(f)) for f in glob.glob('schemas/*.json')]; print('Schemas are valid JSON')"
